description: Periodic GPIO edge feeding for an external watchdog
compatible: "app,gpio-watchdog"
include: base.yaml
properties:
  feed-gpios:
    type: phandle-array
    required: true
    description: On-chip GPIO supporting interrupt-safe toggling
  feed-interval-ms:
    type: int
    required: true
    description: Positive interval between feed edges in milliseconds
