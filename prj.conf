CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_WATCHDOG_EXTERNAL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# USART0 调试控制台：命令与日志共用 Shell 后端。
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_CMDS=y
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="AIDC:~$ "
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# Zephyr RAW 服务端处理功能码，APP 仍管理物理 UART。
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1
CONFIG_MODBUS_FP_EXTENSIONS=n
CONFIG_MODBUS_FC08_DIAGNOSTIC=n
# APP port.c 管理 UART，公共 Modbus 模块适配官方 RAW 服务端。
CONFIG_MODBUS_SERIAL=n
CONFIG_TRANSMIT=y
CONFIG_DATAPROCESS=y
CONFIG_HEAP_MEM_POOL_ADD_SIZE_DATAPROCESS=4096
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BLOCK_IN_THREAD=n
# USART0 Shell：查看并调整各模块已编译支持的日志级别。
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_CMDS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_KERNEL_BIN_NAME="IDU-pre"
