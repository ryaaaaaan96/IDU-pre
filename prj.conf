CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_WATCHDOG_EXTERNAL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# USART0 调试控制台：命令与日志共用 Shell 后端。
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_CMDS=y
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="AIDC:~$ "
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# IAPv3 复用 Zephyr Modbus 的 ADU 结构；不启用客户端/服务端角色。
CONFIG_MODBUS=y
CONFIG_MODBUS_FP_EXTENSIONS=n
# 当前产品不运行采集和转发，模块源码保留但不参与构建。
CONFIG_DATAPROCESS=y
# 私有设备节点与本机 24 个点数据约 880 B。
CONFIG_HEAP_MEM_POOL_ADD_SIZE_DATAPROCESS=2048
# 参数暂存/持久副本和提交镜像约 2.8 KB。
CONFIG_HEAP_MEM_POOL_ADD_SIZE_DP_PARAMS=4096
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BLOCK_IN_THREAD=n
# USART0 Shell：查看并调整各模块已编译支持的日志级别。
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_CMDS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_KERNEL_BIN_NAME="IDU-pre"
