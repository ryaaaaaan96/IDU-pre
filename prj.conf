CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_WATCHDOG_EXTERNAL=y
CONFIG_WATCHDOG_SOFTWARE=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
# USART0 调试控制台：命令与日志共用 Shell 后端。
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_HELP=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="AIDC:~$ "
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT_SERVER=y
CONFIG_MODBUS_FP_EXTENSIONS=n
CONFIG_MODBUS_NONCOMPLIANT_SERIAL_MODE=y
CONFIG_VPORT_MAX_PORTS=2
CONFIG_DATAPROCESS=y
# 两个远端设备和本地测点共需 162 字节，计入共享堆预算。
CONFIG_HEAP_MEM_POOL_ADD_SIZE_DATAPROCESS=256
# 共享 k_malloc 预算，按当前产品配置手动设置。
CONFIG_HEAP_MEM_POOL_ADD_SIZE_DP_WORK=12288
CONFIG_HEAP_MEM_POOL_ADD_SIZE_COLLECT=8192
CONFIG_HEAP_MEM_POOL_ADD_SIZE_TRANSMIT=4096
CONFIG_CO_MODBUS_ADAPTER=y
# 按 IDU 手动设置容量，上传协议选项不覆盖这些值。
CONFIG_CO_MAX_BUSES=1
# 大型 ADU、排队请求和 RAW 报文已移至共享堆。
CONFIG_CO_STACK_SIZE=4096
CONFIG_TR_PORTS=1
CONFIG_TR_STACK_SIZE=4096
CONFIG_TR_CONFIG_STACK_SIZE=2048
CONFIG_ZBUS_PREFER_DYNAMIC_ALLOCATION=n
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=2
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=640
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_FLASH_MAP=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BLOCK_IN_THREAD=n
# USART0 Shell：查看并调整各模块已编译支持的日志级别。
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_CMDS=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_KERNEL_BIN_NAME="IDU-pre"

CONFIG_DP_PARAMS=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

CONFIG_IDU_COLLECT_PERIOD_MS=500
CONFIG_IDU_COLLECT_RETRIES=2
CONFIG_IDU_COLLECT_EXCEPTION_MS=3000
CONFIG_IDU_COLLECT_PROBE_MS=30000
CONFIG_IDU_FORWARD_UNIT=16
CONFIG_IDU_PROTOCOL_SERVICE_PERIOD_MS=100

# 每次实际南向交换的预算包含等锁、发送和响应等待。
CONFIG_CO_EXCHANGE_TIMEOUT_MS=500
