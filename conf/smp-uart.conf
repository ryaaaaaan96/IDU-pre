# 可选的标准 Zephyr 上传通道，使用 USART0 调试控制台。
# USART2 RS485 转发接口仍由 Modbus 占用。
# 专用 SMP UART 独占 USART0 RX，不得再安装第二个接收处理器。
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_PROMPT_UART=""
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_MUTEX=y
CONFIG_MCUMGR_GRP_IMG_TOO_LARGE_SYSBUILD=y
CONFIG_MCUMGR_GRP_IMG_SLOT_INFO=y
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_SLOT=n
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_UART_CONSOLE_MCUMGR=y
