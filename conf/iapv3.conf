CONFIG_IAP=y
CONFIG_IAP_CONFIGURED=y
CONFIG_IAP_IMAGE_MAX_SIZE=0x6e000
CONFIG_IAP_REBOOT_DP_PARAMS=y
# Legacy SUNGROW transport constant; firmware authentication uses MCUboot P-256.
CONFIG_IAP_AES_KEY_HEX="73646b6a73646b6a3132393837333931"
CONFIG_IDU_IAPV3=y
# Legacy IAP FC16 packets exceed the ordinary Modbus RTU 256-byte ADU.
CONFIG_MODBUS_BUFFER_SIZE=1100
CONFIG_IMG_ERASE_PROGRESSIVELY=y
