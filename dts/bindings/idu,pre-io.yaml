description: IDU-pre direct digital inputs, address switches, and watchdog feed
compatible: "idu,pre-io"
include: base.yaml
properties:
  io-channels:
    type: phandle-array
    required: true
    description: Analog inputs in application channel order
  di-gpios:
    type: phandle-array
    required: true
    description: Sixteen digital inputs in DI1 to DI16 order
  address-gpios:
    type: phandle-array
    required: true
    description: Four address switches, with ordering selected by address-bit-order
  di-bit-order:
    type: string
    enum: ["lsb-first", "msb-first"]
    default: "lsb-first"
  address-bit-order:
    type: string
    enum: ["lsb-first", "msb-first"]
    default: "msb-first"
  address-offset:
    type: int
    default: 1
  watchdog-gpios:
    type: phandle-array
    required: true
  watchdog-feed-ms:
    type: int
    required: true
  watchdog-health-ms:
    type: int
    required: true
