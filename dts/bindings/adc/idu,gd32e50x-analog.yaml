description: GD32E50x application ADC acquisition with legacy MV-IO channel order
compatible: "idu,gd32e50x-analog"
include: [base.yaml, pinctrl-device.yaml]
properties:
  reg:
    required: true
  channel-order:
    type: array
    required: true
    description: Physical ADC channel IDs in application channel order
  vref-mv:
    type: int
    required: true
  pinctrl-0:
    required: true
  pinctrl-names:
    required: true
